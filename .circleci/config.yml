version: 2.1

orbs:
  win: circleci/windows@2.2.0

workflows:
  version: 2
  test:
    jobs:
      - test-2.7
      - test-3.6

jobs:
  test:
    test-3.6: &test-template
        docker:
            - image: python:3.6
        steps:
            - checkout
            - run:
                  name: Install system deps
                  command: apt-get update && apt-get install -y libsndfile1 ffmpeg
            - restore_cache:
                  keys:
                      - v0.1-dependencies-{{ checksum "setup.py" }}-{{ checksum "requirements_dev.txt" }}-{{ .Environment.CIRCLE_JOB }}
                      - v0.1-dependencies-{{ .Environment.CIRCLE_JOB }}
            - run:
                  name: Install python dependencies
                  command: |
                      tox
            - save_cache:
                  paths:
                      - ./venv
                  key: v0.1-dependencies-{{ checksum "setup.py" }}-{{ checksum "requirements_dev.txt" }}-{{ .Environment.CIRCLE_JOB }}
            - run:
                  name: Run tests
                  command: |
                      tox -v -e v3.6
            - store_test_results:
                  path: results
    test-2.7:
        <<: *test-template
        docker:
            - image: python:2.7
