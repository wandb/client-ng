version: 2.1

workflows:
  main:
    jobs:
      - test:
         name: "Python 2.7"
         image: "python:2.7"
         toxenv: "py27"
      - test:
         name: "Python 3.6"
         image: "python:3.6"
         toxenv: "py36"
      - test:
         name: "Python 3.7"
         image: "python:3.7"
         toxenv: "py37"
jobs:
    test:
        parameters:
            image:
              type: string
            toxenv:
              type: string
        docker:
            - image: << parameters.image >>
        steps:
            - checkout
            - run:
                  name: Install system deps
                  command: apt-get update && apt-get install -y libsndfile1 ffmpeg
            - restore_cache:
                  keys:
                      - v0.2-dependencies-{{ checksum "setup.py" }}-{{ checksum "requirements_dev.txt" }}-{{ .Environment.CIRCLE_JOB }}
                      - v0.2-dependencies-{{ .Environment.CIRCLE_JOB }}
            - run:
                  name: Install python dependencies
                  command: |
                      pip install tox
            - save_cache:
                  paths:
                      - ./venv
                  key: v0.2-dependencies-{{ checksum "setup.py" }}-{{ checksum "requirements_dev.txt" }}-{{ .Environment.CIRCLE_JOB }}
            - run:
                  name: Run tests
                  command: |
                      tox -v -e << parameters.toxenv >>
            - store_test_results:
                  path: results

